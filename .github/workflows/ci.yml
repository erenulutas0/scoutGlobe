name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv is installed from PyPI so the workflow does not depend on an action tag.
      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          uv sync --project services/api
          uv sync --project services/etl

      # eslint (web, core) + ruff (api, etl)
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # No database in CI: the API health test asserts the "db down" path and the
      # ETL integration test skips itself when Postgres is unreachable.
      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build
