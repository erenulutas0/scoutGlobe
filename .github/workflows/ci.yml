name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test
    runs-on: ubuntu-latest

    # A real Postgres (with pgvector) so the API tests exercise the migrations
    # and the queries, instead of skipping themselves.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: scoutglobe
          POSTGRES_PASSWORD: scoutglobe
          POSTGRES_DB: scoutglobe
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U scoutglobe -d scoutglobe"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql+psycopg://scoutglobe:scoutglobe@localhost:5435/scoutglobe

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # uv is installed from PyPI so the workflow does not depend on an action tag.
      - name: Install uv
        run: python -m pip install --upgrade uv

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dependencies
        run: |
          uv sync --project services/api
          uv sync --project services/etl

      # eslint (web, core) + ruff (api, etl)
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # The generated TypeScript contract must match the Python one.
      - name: OpenAPI types are in sync
        run: |
          pnpm openapi
          git diff --exit-code -- packages/core/openapi.json packages/core/src/api/schema.ts

      # alembic.ini resolves its script_location relative to itself, so the
      # migration must run from services/api like it does locally.
      - name: Migrate
        working-directory: services/api
        run: uv run alembic upgrade head

      # Seeds only from files in the repo (no network, no credentials), which
      # lets the ETL integration test run instead of skipping.
      - name: Seed reference data
        working-directory: services/etl
        run: uv run python -m jobs.seed_reference

      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm build
