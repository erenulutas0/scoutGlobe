[project]
name = "scoutglobe-etl"
version = "0.1.0"
description = "ScoutGlobe data ingestion jobs"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "pandas>=3.0.5",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.3",
    "scoutglobe-api>=0.1.0",
    "sqlalchemy>=2",
]

[tool.uv]
# Job runner, not a distributable package: `uv run python -m jobs.<job>`.
package = false

[tool.uv.sources]
scoutglobe-api = { path = "../api", editable = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
]
